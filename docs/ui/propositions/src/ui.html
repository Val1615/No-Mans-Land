<!doctype html><html lang="fr"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;overflow:hidden}
body{background:#211c18 center/cover no-repeat;position:relative;font-size:14px}
.hud,.dlg,.inv,.keys,.loc,.mini,.toast{position:absolute}
img.p{display:block;object-fit:cover}
/* ---------- A : radio de récupération (ambre) ---------- */
.A{--c:#f2b44a;--d:rgba(242,180,74,.55);--bg:rgba(14,10,5,.58);font-family:'IBM Plex Mono',monospace;color:var(--c)}
.A .panel{background:var(--bg);border:1px solid var(--d);backdrop-filter:blur(2px);box-shadow:0 0 18px rgba(242,180,74,.08) inset;position:relative}
.A .panel:after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(242,180,74,.05) 0 1px,transparent 1px 3px)}
.A .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.A .bar{height:6px;border:1px solid var(--d);width:120px}.A .bar i{display:block;height:100%;background:var(--c)}
.A .hud{left:14px;top:14px;padding:8px 12px;display:flex;gap:18px;align-items:center}
.A .hud b{font-family:'VT323';font-size:22px;font-weight:400;line-height:1}
.A .loc{right:14px;top:14px;padding:6px 10px;font-family:'VT323';font-size:20px}
.A .keys{right:14px;bottom:14px;display:flex;gap:6px}.A .keys span{padding:5px 8px;font-size:11px;border:1px solid var(--d);background:var(--bg)}
.A .dlg{left:14px;bottom:14px;width:540px;padding:12px 14px}
.A .dlg .who{display:flex;gap:10px;align-items:center;margin-bottom:8px}.A .dlg .who img{width:44px;height:44px;filter:sepia(1) saturate(2.2) hue-rotate(-12deg) brightness(.9);border:1px solid var(--d)}
.A .dlg .txt{font-size:14px;line-height:1.45;color:#f6d79a}
.A .opts{margin-top:10px;border-top:1px dashed var(--d);padding-top:8px}.A .opts div{padding:3px 0;font-size:13.5px}.A .opts div.sel{background:rgba(242,180,74,.16)}.A .opts div:before{content:attr(data-n)'> ';opacity:.6}
.A .inv{right:14px;top:62px;bottom:62px;width:560px;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.A .inv h3{font-family:'VT323';font-weight:400;font-size:22px}.A .inv li{list-style:none;display:flex;justify-content:space-between;padding:3px 4px;font-size:13px}.A .inv li.sel{background:rgba(242,180,74,.18)}
.A .inv .desc,.A .inv .deal{grid-column:1/3;border-top:1px dashed var(--d);padding-top:8px;font-size:12.5px;line-height:1.45;color:#f6d79a}
.A .mini{left:14px;top:14px;font-family:'VT323';font-size:20px;text-shadow:0 0 6px #000}
/* ---------- B : carnet de route (papier, encre) ---------- */
.B{--ink:#2b1d12;--red:#7a2414;font-family:'Crimson Pro',serif;color:var(--ink)}
.B .panel{background:rgba(226,208,170,.80);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .12 0 0 0 .22 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  box-shadow:2px 3px 10px rgba(0,0,0,.35);clip-path:polygon(0 2%,3% 0,40% 1%,70% 0,100% 1.5%,99.4% 40%,100% 98%,60% 100%,25% 98.6%,0 100%,.6% 60%)}
.B .hud{left:14px;top:12px;padding:8px 14px 9px;display:flex;gap:16px;align-items:baseline;font-size:16px}
.B .hud b{font-family:'Special Elite';font-weight:400}.B .hud .s{font-family:'Caveat';font-size:19px;color:var(--red)}
.B .loc{right:14px;top:12px;padding:6px 14px;font-family:'Cormorant SC';font-weight:600;font-size:18px}
.B .keys{right:14px;bottom:14px;display:flex;gap:8px}.B .keys span{padding:4px 10px;font-family:'Special Elite';font-size:12px}
.B .dlg{left:14px;bottom:14px;width:520px;padding:14px 18px 12px}
.B .dlg .who{display:flex;gap:12px;align-items:center;margin-bottom:6px;font-family:'Special Elite';font-size:15px}.B .dlg .who img{width:46px;height:46px;filter:grayscale(1) sepia(.6) contrast(1.1);border:1px solid var(--ink);transform:rotate(-2deg)}
.B .dlg .txt{font-size:17px;line-height:1.35}
.B .opts{margin-top:8px}.B .opts div{font-family:'Kalam';font-size:15px;padding:1px 0;color:#3b2a1c}.B .opts div:before{content:attr(data-n)'.  ';color:var(--red)}.B .opts div.sel{text-decoration:underline wavy rgba(122,36,20,.6)}
.B .inv{right:14px;top:60px;bottom:60px;width:560px;padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.B .inv h3{font-family:'Cormorant SC';font-size:20px;border-bottom:1px solid rgba(43,29,18,.5)}.B .inv li{list-style:none;display:flex;justify-content:space-between;font-size:15.5px;padding:1px 2px}.B .inv li.sel{background:rgba(122,36,20,.12)}
.B .inv .desc,.B .inv .deal{grid-column:1/3;font-size:15px;line-height:1.35;border-top:1px dashed rgba(43,29,18,.45);padding-top:6px}.B .deal{font-family:'Caveat';font-size:19px!important;color:var(--red)}
.B .mini{left:14px;top:12px;font-family:'Special Elite';color:#f1e3c4;text-shadow:0 1px 3px #000;font-size:15px}
.B .bar{display:none}
/* ---------- C : diégétique minimal ---------- */
.C{font-family:'Barlow Semi Condensed',sans-serif;color:#efe6d6;text-shadow:0 1px 3px rgba(0,0,0,.85)}
.C .panel{background:none}
.C .hud{left:16px;top:14px;display:flex;gap:16px;align-items:center;font-size:14px;font-weight:500}
.C .hud .pip{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c9b48a;margin-right:5px;box-shadow:0 0 3px #000}
.C .bar{height:3px;width:80px;background:rgba(255,255,255,.18)}.C .bar i{display:block;height:100%;background:#d9c49a}
.C .loc{right:16px;top:14px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.C .keys{right:16px;bottom:14px;display:flex;gap:14px;font-size:12px;opacity:.75}
.C .dlg{left:0;right:0;bottom:0;padding:40px 22px 16px;background:linear-gradient(transparent,rgba(10,8,6,.66) 45%);display:grid;grid-template-columns:52px 560px;gap:4px 14px}
.C .dlg .who{grid-row:1/3;display:block}.C .dlg .who img{width:48px;height:48px;border-radius:50%;opacity:.92;box-shadow:0 0 0 1px rgba(255,255,255,.3)}.C .dlg .who span{display:none}
.C .dlg .name{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#d9c49a}
.C .dlg .txt{font-size:16.5px;line-height:1.35;font-weight:400}
.C .opts{grid-column:2;margin-top:6px}.C .opts div{font-size:15px;padding:1px 0;opacity:.8}.C .opts div.sel{opacity:1;color:#f3d79c}.C .opts div:before{content:attr(data-n)'  ';color:#d9c49a;opacity:.8}
.C .inv{right:0;top:0;bottom:0;width:470px;padding:56px 24px 20px;background:linear-gradient(90deg,transparent,rgba(10,8,6,.62) 22%);display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:14px 20px}
.C .inv h3{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#d9c49a;font-weight:500}.C .inv li{list-style:none;display:flex;justify-content:space-between;font-size:14.5px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.08)}.C .inv li.sel{color:#f3d79c}
.C .inv .desc,.C .inv .deal{grid-column:1/3;font-size:14px;line-height:1.4;opacity:.92}.C .deal{color:#f3d79c}
.C .mini{left:16px;top:14px;font-size:13px;opacity:.8}
/* ---------- mobile ---------- */
.m.A .hud{left:8px;right:8px;top:8px;gap:10px;padding:6px 8px;flex-wrap:wrap}.m.A .hud b{font-size:18px}.m.A .bar{width:60px}
.m .loc{top:auto!important;bottom:auto}.m.A .loc,.m.B .loc,.m.C .loc{right:8px;top:54px!important;font-size:15px}
.m .keys{left:8px;right:8px;bottom:8px;justify-content:space-between}
.m .dlg{left:8px!important;right:8px;width:auto!important;bottom:52px!important}
.m.C .dlg{left:0!important;right:0;bottom:0!important;padding:40px 14px 54px;grid-template-columns:40px 1fr}.m.C .dlg .who img{width:38px;height:38px}
.m.C .dlg .txt{font-size:15px}
.m .inv{left:8px!important;right:8px!important;width:auto!important;top:auto!important;bottom:52px!important;height:auto;grid-template-columns:1fr!important}
.m.C .inv{left:0!important;right:0!important;bottom:0!important;height:auto;padding:40px 16px 56px;background:linear-gradient(transparent,rgba(10,8,6,.72) 14%)}
.m .inv .desc,.m .inv .deal{grid-column:1!important}
.m .inv{gap:8px!important}.m .inv li{padding:1px 4px!important}
.m .opts div{padding:7px 0!important}
.m.B .hud{left:8px;right:8px;top:8px;flex-wrap:wrap;gap:10px;font-size:14px}
.m.C .hud{left:12px;right:12px;top:10px;flex-wrap:wrap;gap:10px}
.A .hud,.A .loc,.A .dlg,.A .inv,.A .keys{position:absolute}
.A .inv,.B .inv{top:auto!important;bottom:56px;align-content:start}
.B .inv{width:520px}
.tag{position:absolute;left:50%;transform:translateX(-50%);bottom:4px;font:11px 'Inter';color:#fff;opacity:0}
</style></head><body>
<script>
const q = new URLSearchParams(location.search), D = q.get('d'), S = q.get('s'), M = q.get('m') === '1';
document.body.className = D + (M ? ' m' : '');
document.body.style.backgroundImage = `url(${q.get('bg')})`;
const H = (h) => document.body.insertAdjacentHTML('beforeend', h);
const nilo = D === 'A' ? 'NILO · suit' : D === 'B' ? 'Nilo suit' : 'Nilo, à côté';
const hud = () => {
  if (S === 'mini') { H(`<div class="mini">${D === 'A' ? 'PV 27/40 · 40 $' : D === 'B' ? '27/40 · 40 $' : '27 / 40 &nbsp; · &nbsp; 40 $'}</div>`); return; }
  if (D === 'A') H(`<div class="hud panel"><div><div class="lbl">Points de vie</div><b>27/40</b><div class="bar"><i style="width:67%"></i></div></div><div><div class="lbl">Dollars</div><b>40 $</b></div><div style="display:flex;gap:8px;align-items:center"><img class="p" src="nilo.webp" style="width:30px;height:30px;filter:sepia(1) saturate(2.2) hue-rotate(-12deg);border:1px solid var(--d)"><div><div class="lbl">Compagnon</div>${nilo}</div></div></div>`);
  if (D === 'B') H(`<div class="hud panel"><span>PV <b>27</b>/40</span><span><b>40 $</b></span><span style="display:flex;gap:6px;align-items:center"><img class="p" src="nilo.webp" style="width:26px;height:26px;filter:grayscale(1) sepia(.6);border:1px solid #2b1d12">${nilo}</span><span class="s">${M ? '' : 'patrouille passée hier'}</span></div>`);
  if (D === 'C') H(`<div class="hud"><span><span class="pip"></span>27 / 40</span><div class="bar"><i style="width:67%"></i></div><span>40 $</span><span style="display:flex;gap:6px;align-items:center;opacity:.9"><img class="p" src="nilo.webp" style="width:22px;height:22px;border-radius:50%">${nilo}</span></div>`);
  H(`<div class="loc ${D === 'C' ? '' : 'panel'}">${D === 'A' ? 'DUSK-TOWN / LA POMPE' : D === 'B' ? 'Dusk-Town, La Pompe' : 'Dusk-Town · La Pompe'}</div>`);
  const k = M ? ['Sac', 'Journal', 'Carte', 'Discret'] : ['I  Sac', 'J  Journal', 'M  Carte', 'H  Interface discrète'];
  H(`<div class="keys">${k.map(t => `<span class="${D === 'C' ? '' : 'panel'}">${t}</span>`).join('')}</div>`);
};
const dlg = () => H(`<div class="dlg panel"><div class="who"><img class="p" src="hector.webp"><span>${D === 'A' ? 'HECTOR · Le Passage' : 'Hector'}</span></div>${D === 'C' ? '<div class="name">Hector</div>' : ''}
  <div class="txt">On est sur leur route. Les soldats de Steel font halte ici avant d'aller fouiller les terres. Ils remplissent leurs gourdes, ils fouillent deux ou trois maisons, et ils repartent avec qui leur plaît.</div>
  <div class="opts"><div data-n="1" class="sel">Et personne ne se défend ?</div><div data-n="2">Un repas, s'il te plaît (6 $)</div><div data-n="3">Un verre (3 $)</div><div data-n="4">Merci, Hector.</div></div></div>`);
const inv = () => H(`<div class="inv panel"><div><h3>${D === 'A' ? 'SAC · 11,5/25 KG' : 'Ton sac · 11,5 / 25 kg'}</h3><ul>
  <li>Eau filtrée<span>×1</span></li><li class="sel">Pied-de-biche<span>×1</span></li><li>Ration<span>×2</span></li><li>Bandages<span>×3</span></li><li>Munitions 9 mm<span>×12</span></li><li>Mot de Teo<span>note</span></li></ul></div>
  <div class="col2"><h3>${D === 'A' ? 'TROC · ANSELME' : 'Troc avec Anselme'}</h3><ul><li>Eau filtrée<span>4 $</span></li><li class="sel">Ration<span>5 $</span></li><li>Sel, un sachet<span>2 $</span></li><li>Allumettes<span>1 $</span></li><li>Fil de fer<span>3 $</span></li></ul></div>
  <div class="desc"><b>Pied-de-biche.</b> Acier rouillé, manche gainé de chambre à air. Ouvre ce qui est cloué. Anselme en offre 9 $.</div>
  <div class="deal">Tu donnes le pied-de-biche (9 $), tu prends deux rations (10 $). Il reste 1 $ à payer. ${M ? '' : '&nbsp;[Entrée] conclure · [Échap] annuler'}</div></div>`);
hud(); if (S === 'dlg') dlg(); if (S === 'inv') inv();
if (S === 'mini') H(`<div class="keys" style="opacity:.45"><span class="${D === 'C' ? '' : 'panel'}">H</span></div>`);
</script></body></html>
