<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No Man's Land 2175 · Dusk-Town</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./src/style.css">
<script type="importmap">{"imports":{"three": "./vendor/three.module.js"}}</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>
<!-- v8 : interface « radio de récupération » (docs/ui/propositions/direction-A.png). Cadres fins, fonds semi-transparents, ambre réservé au texte. -->
<div id="hud" class="rp">
  <div class="cell"><div class="lbl">Points de vie</div><b id="hp"></b><div class="bar"><i id="hpbar"></i></div></div>
  <div class="cell"><div class="lbl" id="money-lbl">Dollars</div><b id="money"></b></div>
  <div class="cell nilo"><img id="nilo-portrait" src="./assets/reused/portrait-nilo.webp" alt=""><div><div class="lbl">Compagnon</div><span id="nilo"></span></div></div>
  <span id="inv" hidden></span>
</div>
<div id="locbox" class="rp"><span id="loc"></span><span class="tag" title="Prototype">PROTO</span></div>
<div id="obj" class="rp" hidden title="Objectif (toucher pour déplier)"><span class="lbl">OBJECTIF</span> <span id="obj-text"></span></div>
<div id="mini" class="mono" hidden></div>
<div id="msg" class="mono" role="status" aria-live="polite"></div>
<div id="actions"><button id="act" class="rp" hidden><i class="ic" data-ic="entrer" aria-hidden="true"></i><span id="act-text"></span><u class="key">E</u></button></div>
<!-- lot 1 interface : rangée compacte d'icônes (assets/ui/icons d'Ocre, teintées en CSS par mask-image), touche en petit, réductible (Tab) -->
<nav id="keys" aria-label="Menus">
  <button id="k-menu" class="rp" aria-label="Menu" title="Menu (Échap)"><i class="ic" data-ic="menu"></i><u class="key">Échap</u><span class="sr">Menu</span></button><button id="k-sac" class="rp" data-panel="sac" aria-label="Sac" title="Sac (I)"><i class="ic" data-ic="sac"></i><u class="key">I</u><span class="sr">Sac</span></button><button id="k-journal" class="rp" data-panel="journal" aria-label="Journal" title="Journal (J)"><i class="ic" data-ic="journal"></i><u class="key">J</u><span class="sr">Journal</span></button><button id="k-carte" class="rp" data-panel="carte" aria-label="Carte" title="Carte (M)"><i class="ic" data-ic="carte"></i><u class="key">M</u><span class="sr">Carte</span></button><button id="k-son" class="rp" aria-pressed="false" aria-label="Son" title="Son (S)"><i class="ic" data-ic="son_on"></i><u class="key">S</u><span class="sr">Son</span></button><button id="k-mini" class="rp" aria-pressed="false" aria-label="Discret" title="Mode discret (H)"><i class="ic" data-ic="discret_off"></i><u class="key">H</u><span class="sr">Discret</span></button><button id="k-fold" class="rp" aria-expanded="true" aria-label="Replier la barre" title="Replier / déplier (Tab)"><i class="ic" data-ic="replier"></i><u class="key">Tab</u></button>
</nav>
<!-- Combat C1 : liseré ambre, file d'initiative (haut gauche), PA / PV (bas gauche), actions (bas droite). Rien dans le tiers central. -->
<div id="cbt" hidden><div id="cbt-file" class="rp"></div><div id="cbt-res" class="rp"><div class="lbl">PA</div><div id="cbt-pa"></div><div id="cbt-info" class="muted"></div></div>
  <div id="cbt-actions"><button id="cbt-recharger" class="rp">Recharger</button><button id="cbt-end" class="rp">Fin du tour</button><button id="cbt-rendre" class="rp">Se rendre</button></div></div>
<section id="panel" class="rp" hidden><button id="panel-close" aria-label="Fermer">×</button><div id="panel-body"></div></section>
<div id="dialogue" class="rp" hidden role="dialog" aria-modal="false">
  <div class="who"><img id="dlg-portrait" alt=""><div id="dlg-name"></div></div>
  <p id="dlg-text"></p>
  <div id="dlg-options"></div>
  <button id="dlg-close" aria-label="Fermer">×</button>
</div>
<!-- v10 lot 1 : menu principal / pause, sauvegardes, options -->
<div id="menu" hidden>
  <div class="m-bg"></div>
  <div class="m-main rp">
    <h1>NO MAN'S LAND</h1><div class="lbl">Dusk-Town · 2175</div>
    <button id="m-resume" class="btn" hidden><span>Reprendre</span></button>
    <button id="m-continue" class="btn"><span>Continuer</span><small id="m-continue-info"></small></button>
    <button id="m-new" class="btn"><span>Nouveau jeu</span></button>
    <button id="m-load" class="btn" data-sub="load"><span>Charger</span></button>
    <button id="m-options" class="btn" data-sub="options"><span>Options</span></button>
    <button id="m-codex" class="btn" data-sub="codex"><span>Codex</span></button>
    <button id="m-credits" class="btn" data-sub="credits"><span>Crédits</span></button>
    <button id="m-quit" class="btn"><span>Quitter</span><small>retour à l'écran titre</small></button>
    <div id="menu-note" class="muted" role="status"></div>
  </div>
  <section id="menu-sub" class="rp" hidden></section>
</div>
<!-- v11 lot 2 : création de personnage -->
<div id="creation" hidden></div>
<script type="module" src="./src/main.js"></script>
<audio id="music" src="./assets/audio/dusk_town_ambiance.mp3" loop preload="auto"></audio>
</body>
</html>
